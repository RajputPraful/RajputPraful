<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 64" width="800" height="64" role="img" aria-label="Profile">
<title>Profile</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset=".55" stop-color="#a371f7"/><stop offset="1" stop-color="#39c5cf"/></linearGradient>
<marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker></defs>
<style>
.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .7s ease backwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.dash{stroke-dasharray:5 5;animation:dash 1.2s linear infinite}
@keyframes act{0%,14%{opacity:1}18%,100%{opacity:0}}
</style>
<g class="fu" style="animation-delay:0s"><text x="0" y="36" class="m" font-size="13" font-weight="600" fill="#58a6ff" text-anchor="start" >01</text><text x="34" y="40" class="s" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start" >Profile</text><text x="800" y="38" class="m" font-size="11" font-weight="400" fill="#8b949e" text-anchor="end" >// identity.config</text><rect x="0" y="54" width="800" height="1" fill="#30363d"/><rect x="0" y="53" width="140" height="3" rx="1.5" fill="url(#g)"><animate attributeName="x" values="0;660;0" dur="7s" repeatCount="indefinite"/></rect></g>
</svg>