<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Praful Singh - Computer Science Engineer, Developer, Builder">
<title>Praful Singh - Computer Science Engineer, Developer, Builder</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset=".55" stop-color="#a371f7"/><stop offset="1" stop-color="#39c5cf"/></linearGradient>
<marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker>
<linearGradient id="gn" x1="0" y1="0" x2="0.6" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#a371f7"/><stop offset="1" stop-color="#39c5cf"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;0.6 0;0 0" dur="8s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="rad"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="fade"><rect width="900" height="280" fill="url(#rad)"/></mask>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#262c36" stroke-width="1"/></pattern>
<radialGradient id="b1"><stop offset="0" stop-color="#58a6ff" stop-opacity=".28"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#a371f7" stop-opacity=".26"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient>
<clipPath id="cl"><rect width="900" height="280" rx="16"/></clipPath></defs>
<style>
.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .7s ease backwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.dash{stroke-dasharray:5 5;animation:dash 1.2s linear infinite}
@keyframes act{0%,14%{opacity:1}18%,100%{opacity:0}}

@keyframes cyc{0%{opacity:0}4%,30%{opacity:1}34%,100%{opacity:0}}
.c{opacity:0;animation:cyc 9s infinite}
.c1{opacity:1;animation-delay:0s}.c2{animation-delay:3s}.c3{animation-delay:6s}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
<g clip-path="url(#cl)">
<rect width="900" height="280" rx="16" fill="#0d1117"/>
<rect width="900" height="280" fill="url(#grid)" mask="url(#fade)"/>
<circle cx="220" cy="130" r="230" fill="url(#b1)"><animateTransform attributeName="transform" type="translate" values="0 0;70 20;0 0" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="700" cy="150" r="230" fill="url(#b2)"><animateTransform attributeName="transform" type="translate" values="0 0;-70 -20;0 0" dur="16s" repeatCount="indefinite"/></circle>
<circle cx="90" cy="90" r="1.6" fill="#58a6ff"><animate attributeName="opacity" values=".08;.9;.08" dur="3s" begin="0s" repeatCount="indefinite"/></circle><circle cx="240" cy="200" r="1.6" fill="#58a6ff"><animate attributeName="opacity" values=".08;.9;.08" dur="4s" begin="1s" repeatCount="indefinite"/></circle><circle cx="380" cy="70" r="1.6" fill="#58a6ff"><animate attributeName="opacity" values=".08;.9;.08" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle><circle cx="560" cy="210" r="1.6" fill="#58a6ff"><animate attributeName="opacity" values=".08;.9;.08" dur="4s" begin="2s" repeatCount="indefinite"/></circle><circle cx="700" cy="80" r="1.6" fill="#58a6ff"><animate attributeName="opacity" values=".08;.9;.08" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle><circle cx="820" cy="150" r="1.6" fill="#58a6ff"><animate attributeName="opacity" values=".08;.9;.08" dur="4.5s" begin="0.8s" repeatCount="indefinite"/></circle><circle cx="150" cy="160" r="1.6" fill="#58a6ff"><animate attributeName="opacity" values=".08;.9;.08" dur="3.2s" begin="2.2s" repeatCount="indefinite"/></circle><circle cx="760" cy="230" r="1.6" fill="#58a6ff"><animate attributeName="opacity" values=".08;.9;.08" dur="3.8s" begin="0.3s" repeatCount="indefinite"/></circle>
<rect x="0" y="38" width="900" height="2" fill="url(#g)" opacity=".4"><animateTransform attributeName="transform" type="translate" values="0 0;0 236;0 0" dur="9s" repeatCount="indefinite"/></rect>
<rect width="900" height="38" fill="#0d1117" opacity=".7"/>
<line x1="0" y1="38" x2="900" y2="38" stroke="#30363d"/>
<circle cx="24" cy="19" r="5" fill="#ff5f56" opacity=".85"/><circle cx="42" cy="19" r="5" fill="#ffbd2e" opacity=".85"/><circle cx="60" cy="19" r="5" fill="#27c93f" opacity=".85"/>
<text x="84" y="23" class="m" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start" >praful@builder:~/RajputPraful</text>
<text x="876" y="23" class="m" font-size="12" font-weight="400" fill="#8b949e" text-anchor="end" >main</text>
<g class="fu" style="animation-delay:0s"><text x="450" y="128" class="s" font-size="60" font-weight="800" fill="url(#gn)" text-anchor="middle" letter-spacing="2" >PRAFUL SINGH</text></g>
<g class="fu" style="animation-delay:0.3s"><text x="450" y="168" class="m" font-size="14" font-weight="500" fill="#8b949e" text-anchor="middle" letter-spacing="3" >COMPUTER SCIENCE ENGINEER  •  DEVELOPER  •  BUILDER</text></g>
<text x="450" y="224" class="m c c1" font-size="14" fill="#e6edf3" text-anchor="middle"><tspan fill="#58a6ff">› </tspan>Building software, experimenting with products, and turning real-world problems into systems.</text><text x="450" y="224" class="m c c2" font-size="14" fill="#e6edf3" text-anchor="middle"><tspan fill="#58a6ff">› </tspan>Builder mindset over tutorial mindset.</text><text x="450" y="224" class="m c c3" font-size="14" fill="#e6edf3" text-anchor="middle"><tspan fill="#58a6ff">› </tspan>Designing systems. Building products. Learning by shipping.</text>
<line x1="24" y1="246" x2="876" y2="246" stroke="#30363d" opacity=".7"/>
<circle cx="30" cy="265" r="3.5" fill="#3fb950" class="pulse"/>
<text x="42" y="269" class="m" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start" >building: private bus mobility platform</text>
<text x="876" y="269" class="m" font-size="11" font-weight="400" fill="#8b949e" text-anchor="end" >Amrita University · Kerala, India · Nepal</text>
</g>
<rect width="900" height="280" rx="16" fill="none" stroke="#30363d"/>
</svg>